name: lumi_kids
description: "LUMI Kids: образовательная платформа для детей 0–7 лет."
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  http: ^1.6.0
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/content/
