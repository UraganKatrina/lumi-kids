name: API

on:
  push:
    branches: [main]
    paths: ['services/api/**', 'content/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['services/api/**', 'content/**', '.github/workflows/api.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lumi_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            content/package-lock.json
            services/api/package-lock.json

      # API использует ту же проверку заданий, что и content/.
      - run: npm ci
        working-directory: content
      - run: npm ci
        working-directory: services/api
      - run: npm run build
        working-directory: services/api
      - run: npm test
        working-directory: services/api
